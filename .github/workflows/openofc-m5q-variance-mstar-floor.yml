name: OpenOFC M5Q Appendix-C M-star variance floor

on:
  push:
    branches:
      - strategy/m5q-data-dependent-mccfr-bound
    paths:
      - tools/openofc_solver/M5Q_VARIANCE_MSTAR_FLOOR_CONTRACT.md
      - tools/openofc_solver/m5q_variance_mstar_floor.py
      - tools/openofc_solver/run_m5q_variance_mstar_floor.py
      - tools/openofc_solver/test_m5q_variance_mstar_floor.py
      - .github/workflows/openofc-m5q-variance-mstar-floor.yml
  workflow_dispatch:

jobs:
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5Q Appendix-C M-star mechanics tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5q_variance_mstar_floor.py
      - name: Run frozen M5Q Appendix-C M-star floor pilot
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5q_variance_mstar_floor.py
      - name: Validate M5Q Appendix-C authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5q_variance_mstar_floor.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'APPENDIX_C_MSTAR_VARIANCE_FLOOR_PILOT_NOT_CERTIFICATION'
          assert data['variance_assumption'] == 0.0
          assert data['sampling_probability_floor_assumption'] == 1.0
          assert data['summary']['actual_variance_measured'] is False
          assert data['summary']['actual_sampling_floor_measured'] is False
          assert data['summary']['production_certification_eligible'] is False
          assert data['summary']['real_routes_certified'] == 0
          assert len(data['rows']) == 4
          assert all(row['production_certification_eligible'] is False for row in data['rows'])
          print('OPENOFC_M5Q_APPENDIX_C_MSTAR_FLOOR_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5q-appendix-c-mstar-floor
          path: artifacts/m5q_variance_mstar_floor.json
          if-no-files-found: error
          retention-days: 14
