name: Patch HU two-round exact caches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-hu-two-round-exact-caches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact memoization patch
        run: python tools/patch_hu_two_round_exact_caches.py
      - name: Persist optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deepofc/hu_two_round.py
          git commit -m "R6: memoize pure two-round exact projections"
          git push origin HEAD:main
