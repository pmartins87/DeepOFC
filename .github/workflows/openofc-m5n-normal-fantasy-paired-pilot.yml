name: OpenOFC M5N Normal-Fantasy paired pilot

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/run_m5n_normal_fantasy_paired_pilot.py
      - .github/workflows/openofc-m5n-normal-fantasy-paired-pilot.yml
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Recheck M5N authority and paired mechanics
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5n_normal_fantasy_paired_screening.py
      - name: Run M5N two-route paired pilot
        run: |
          PYTHONPATH=tools/openofc_solver \
            python tools/openofc_solver/run_m5n_normal_fantasy_paired_pilot.py
      - name: Validate M5N pilot firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/m5n_normal_fantasy_paired_pilot.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'NORMAL_FANTASY_PAIRED_PILOT_NOT_CERTIFICATION'
          assert data['summary']['routes_screened'] == 2
          assert data['summary']['ready_for_real_bellman'] == 0
          assert data['summary']['certification_claimed'] is False
          assert len(data['heldout_seeds']) == 4
          for row in data['routes']:
              screen = row['m5n_screening']
              assert screen['authority'] == 'NORMAL_FANTASY_PAIRED_UNCERTAINTY_SCREENING_ONLY'
              assert screen['certification_eligible'] is False
              assert len(screen['paired_seed_metrics']) == 4
              assert row['promotion_allowed'] is False
              assert row['m5c_evidence']['evidence_kind'] == 'HELD_OUT_SCREENING_ONLY'
              assert row['m5h_report']['promotion_blocked'] is True
          print('OPENOFC_M5N_PILOT_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5n-normal-fantasy-paired-pilot
          path: artifacts/m5n_normal_fantasy_paired_pilot.json
          if-no-files-found: error
          retention-days: 14
