name: OpenOFC external 06R1D
on:
  workflow_dispatch:
  push:
    branches: [research/external-ofc-solver-audit-20260827]
    paths:
      - 'tools/openofc_solver/*06r1d*'
      - '.github/workflows/openofc-external-06r1d.yml'
permissions:
  contents: read
jobs:
  r4-multifix:
    strategy:
      fail-fast: false
      matrix:
        fixture_seed: [64011, 64012, 64013, 64014]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/external_06r1_belief_correct.py tools/openofc_solver/run_external_06r1.py tools/openofc_solver/run_external_06r1d.py
      - name: Revalidate belief core
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m pytest -q tools/openofc_solver/test_external_06r1_belief_correct.py
      - name: Run frozen fixture
        run: |
          PYTHONPATH=.:tools/openofc_solver python tools/openofc_solver/run_external_06r1d.py --fixture-seed ${{ matrix.fixture_seed }} --output artifacts/external_06r1d_${{ matrix.fixture_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-06r1d-${{ matrix.fixture_seed }}
          path: artifacts/external_06r1d_${{ matrix.fixture_seed }}.json
          if-no-files-found: error
          retention-days: 90
