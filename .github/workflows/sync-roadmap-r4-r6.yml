name: Sync roadmap R4-R6

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync_roadmap_r4_r6_20260815.py'
      - '.github/workflows/sync-roadmap-r4-r6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roadmap synchronization
        run: python tools/sync_roadmap_r4_r6_20260815.py
      - name: Persist canonical roadmap only if changed
        run: |
          if git diff --quiet -- docs/ROADMAP.md; then
            echo 'Roadmap already synchronized.'
            exit 0
          fi
          git config user.name 'DeepOFC Roadmap Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'Roadmap: record exact Fantasy and native solver progress'
          git push origin HEAD:main
