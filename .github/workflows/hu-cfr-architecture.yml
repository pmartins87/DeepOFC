name: HU imperfect-info CFR architecture

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_subgame.py'
      - 'deepofc/hu_cfr.py'
      - 'tools/benchmark_hu_cfr_architecture.py'
      - '.github/workflows/hu-cfr-architecture.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact-symmetry and CFR-family benchmark
        run: python tools/benchmark_hu_cfr_architecture.py
