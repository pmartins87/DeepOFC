name: OpenOFC external 05G Q1C exact fixed-profile EV

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05G_Q1C_FIXED_PROFILE_EV_CONTRACT.md'
      - 'tools/openofc_solver/run_external_05g_q1c.py'
      - '.github/workflows/openofc-external-05g-q1c.yml'
  workflow_dispatch:

jobs:
  q1c-exact-fixed-profile-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate 05G support and completion cores
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q \
              tools/openofc_solver/test_external_05g_broad_support.py \
              tools/openofc_solver/test_external_05g_uniform_backward_completion.py
      - name: Run 05G Q1C exact fixed-profile EV matrix
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05g_q1c.py \
              --output artifacts/external_05g_q1c.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05g-q1c
          path: artifacts/external_05g_q1c.json
          if-no-files-found: error
          retention-days: 30
