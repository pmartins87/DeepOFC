name: OpenOFC M5K Normal-Fantasy screening

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/M5K_NORMAL_FANTASY_SCREENING_CONTRACT.md
      - tools/openofc_solver/m5k_normal_fantasy_screening.py
      - tools/openofc_solver/test_m5k_normal_fantasy_screening.py
      - tools/openofc_solver/m5h_normal_heldout_evidence.py
      - tools/openofc_solver/m5c_route_certification.py
      - .github/workflows/openofc-m5k-normal-fantasy-screening.yml
  workflow_dispatch:

jobs:
  m5k-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5K screening and firewall tests
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q \
              tools/openofc_solver/test_m5k_normal_fantasy_screening.py \
              tools/openofc_solver/test_m5h_normal_heldout_evidence.py \
              tools/openofc_solver/test_m5c_route_certification.py
      - name: Compile M5K implementation
        run: |
          python -m py_compile \
            tools/openofc_solver/m5k_normal_fantasy_screening.py
