name: HU two-round external-sampling MCCFR

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'tools/benchmark_hu_two_round_mccfr.py'
      - '.github/workflows/hu-two-round-mccfr.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train deep external sampling and evaluate with exact best response
        run: python tools/benchmark_hu_two_round_mccfr.py
