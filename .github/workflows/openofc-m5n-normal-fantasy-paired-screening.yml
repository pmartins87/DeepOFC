name: OpenOFC M5N Normal-Fantasy paired screening

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/M5N_NORMAL_FANTASY_PAIRED_SCREENING_CONTRACT.md
      - tools/openofc_solver/m5n_normal_fantasy_paired_screening.py
      - tools/openofc_solver/test_m5n_normal_fantasy_paired_screening.py
      - .github/workflows/openofc-m5n-normal-fantasy-paired-screening.yml
  workflow_dispatch:

jobs:
  paired-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5N paired-screening tests
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5n_normal_fantasy_paired_screening.py
      - name: Compile M5N implementation
        run: |
          python -m py_compile tools/openofc_solver/m5n_normal_fantasy_paired_screening.py
