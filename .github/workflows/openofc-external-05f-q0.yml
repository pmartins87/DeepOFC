name: OpenOFC external 05F Q0 hidden-discard overlap

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/external_hidden_discard_overlap.py'
      - 'tools/openofc_solver/test_external_hidden_discard_overlap.py'
      - 'tools/openofc_solver/run_external_05f_q0.py'
      - 'tools/openofc_solver/EXTERNAL_05F_HIDDEN_DISCARD_OVERLAP_CONTRACT.md'
      - '.github/workflows/openofc-external-05f-q0.yml'
  workflow_dispatch:

jobs:
  hidden-discard-overlap-q0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate 05F hidden-discard overlap firewalls
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_hidden_discard_overlap.py
      - name: Run 05F Q0 benchmark
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05f_q0.py \
              --output artifacts/external_05f_q0.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05f-q0
          path: artifacts/external_05f_q0.json
          if-no-files-found: error
          retention-days: 30
