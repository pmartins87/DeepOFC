name: OpenOFC M5L reference qualification Q0B scale

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - deepofc/hu_three_round_br.py
      - deepofc/hu_three_round_sequential.py
      - tools/openofc_solver/M5L_REFERENCE_EVALUATOR_QUALIFICATION_CONTRACT.md
      - tools/openofc_solver/run_m5l_three_round_q0.py
      - tools/openofc_solver/run_m5l_three_round_q0b_scale.py
      - .github/workflows/openofc-m5l-reference-qualification-q0b-scale.yml
  workflow_dispatch:

jobs:
  q0b-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5L extended response-budget scale
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5l_three_round_q0b_scale.py
      - name: Validate Q0B remains diagnostic-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5l_three_round_q0b_scale.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'QUALIFICATION_SCALE_DIAGNOSTIC_NOT_CERTIFICATION'
          assert data['qualification_stage'] == 'Q0B_RESPONSE_SCALE_DIAGNOSTIC'
          assert data['budgets'] == [1024, 4096, 16384, 65536]
          assert data['summary']['rows'] == 8
          assert data['summary']['certification_eligible'] is False
          assert data['summary']['reference_manifest_emitted'] is False
          assert {row['player'] for row in data['rows']} == {0, 1}
          assert all(row['underestimation_residual'] >= 0.0 for row in data['rows'])
          assert all(
              abs(row['exact_best_response_value'] - row['exact_replay_value']) <= 1e-10
              for row in data['rows']
          )
          print('OPENOFC_M5L_Q0B_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5l-reference-qualification-q0b-scale
          path: artifacts/m5l_three_round_q0b_scale.json
          if-no-files-found: error
          retention-days: 14
