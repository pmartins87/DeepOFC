name: HU three-round canonical-sequential exact reference

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/sequential.py'
      - 'deepofc/hu_three_round_sequential.py'
      - 'tools/benchmark_hu_three_round_sequential_reference.py'
      - '.github/workflows/hu-three-round-sequential-reference.yml'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify sequence counts and exhaustive terminal player/suit/Joker symmetry
        run: python -u tools/benchmark_hu_three_round_sequential_reference.py
