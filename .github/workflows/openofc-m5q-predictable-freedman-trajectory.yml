name: OpenOFC M5Q predictable Freedman trajectory

on:
  push:
    branches:
      - strategy/m5q-data-dependent-mccfr-bound
    paths:
      - tools/openofc_solver/M5Q_PREDICTABLE_FREEDMAN_TRAJECTORY_CONTRACT.md
      - tools/openofc_solver/m5q_predictable_freedman_trajectory.py
      - tools/openofc_solver/run_m5q_predictable_freedman_trajectory.py
      - tools/openofc_solver/test_m5q_predictable_freedman_trajectory.py
      - evidence/strategic/m5q_predictable_visit_variance_2026-08-27.json
      - .github/workflows/openofc-m5q-predictable-freedman-trajectory.yml
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run adaptive predictable-Freedman mechanics tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5q_predictable_freedman_trajectory.py
      - name: Run frozen Joker trajectory pilot
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5q_predictable_freedman_trajectory.py
      - name: Validate authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5q_predictable_freedman_trajectory.json').read_text(encoding='utf-8'))
          summary = data['summary']
          assert data['authority'] == 'ADAPTIVE_PREDICTABLE_FREEDMAN_TRAJECTORY_PILOT_NOT_CERTIFICATION'
          assert data['checkpoints'] == [1, 4, 16, 64]
          assert data['training_invariance']['passes'] is True
          assert summary['training_semantics_unchanged'] is True
          assert summary['adaptive_predictable_variance_accumulated'] is True
          assert summary['formal_unbiasedness_proof_bound_to_implementation'] is False
          assert summary['full_game_scalable_average_validated'] is False
          assert summary['production_certification_eligible'] is False
          assert summary['real_routes_certified'] == 0
          for row in data['rows']:
              bound = row['bound']
              assert bound['exploitability_upper'] >= bound['sampled_positive_regret_exploitability'] >= 0.0
              assert bound['concentration_additive_exploitability'] >= 0.0
          print('OPENOFC_M5Q_PREDICTABLE_FREEDMAN_TRAJECTORY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5q-predictable-freedman-trajectory
          path: artifacts/m5q_predictable_freedman_trajectory.json
          if-no-files-found: error
          retention-days: 14
