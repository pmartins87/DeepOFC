name: OpenOFC M5N exact terminal cost microprobe

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/run_m5n_exact_terminal_cost_microprobe.py
      - .github/workflows/openofc-m5n-exact-terminal-cost-microprobe.yml
  workflow_dispatch:

jobs:
  microprobe:
    strategy:
      fail-fast: false
      matrix:
        fantasy_count: [14, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run exact terminal cost microprobe
        run: |
          PYTHONPATH=tools/openofc_solver \
            python tools/openofc_solver/run_m5n_exact_terminal_cost_microprobe.py \
              --fantasy-count ${{ matrix.fantasy_count }}
      - name: Validate runtime-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          count = ${{ matrix.fantasy_count }}
          data = json.loads(Path(f'artifacts/m5n_exact_terminal_cost_f{count}.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'RUNTIME_MICROPROBE_NOT_STRATEGIC_EVIDENCE'
          assert data['fantasy_count'] == count
          assert data['terminal_evaluations'] == 1
          assert data['strategic_evidence'] is False
          assert data['production_certification_eligible'] is False
          assert data['real_routes_certified'] == 0
          print(f'OPENOFC_M5N_TERMINAL_MICROPROBE_F{count}=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5n-terminal-cost-f${{ matrix.fantasy_count }}
          path: artifacts/m5n_exact_terminal_cost_f${{ matrix.fantasy_count }}.json
          if-no-files-found: error
          retention-days: 14
