name: OpenOFC external 05H A1 comparator core validation

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05H_A1_CURRENT_VS_AVERAGE_EXACT_BR_CONTRACT.md'
      - 'tools/openofc_solver/run_external_05h_a1.py'
      - '.github/workflows/openofc-external-05h-a1-core.yml'
  workflow_dispatch:

jobs:
  a1-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile A1 comparator
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile \
            tools/openofc_solver/external_05h_mccfr_simple_average.py \
            tools/openofc_solver/run_external_05h_a1.py
      - name: Revalidate average-policy fidelity
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_05h_mccfr_simple_average.py
