name: OpenOFC external 06R1B phase A
on:
  workflow_dispatch:
  push:
    branches: [research/external-ofc-solver-audit-20260827]
    paths:
      - 'tools/openofc_solver/run_external_06r1b_phase_a.py'
      - 'tools/openofc_solver/EXTERNAL_06R1B_R4_PANEL_CONTRACT.md'
      - '.github/workflows/openofc-external-06r1b-phase-a.yml'
permissions:
  contents: read
jobs:
  exact-panel-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/run_external_06r1b_phase_a.py tools/openofc_solver/r4_exact_oracle_combinatorial.py
      - name: Revalidate combinatorial oracle leaf semantics
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m pytest -q tools/openofc_solver/test_r4_exact_oracle_combinatorial.py
      - name: Run exact panel geometry
        run: |
          PYTHONPATH=.:tools/openofc_solver python tools/openofc_solver/run_external_06r1b_phase_a.py --output artifacts/external_06r1b_phase_a.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-06r1b-r4-panel-phase-a
          path: artifacts/external_06r1b_phase_a.json
          if-no-files-found: error
          retention-days: 90
