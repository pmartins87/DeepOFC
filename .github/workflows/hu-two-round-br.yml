name: HU two-round exact best response

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'tools/benchmark_hu_two_round_br.py'
      - '.github/workflows/hu-two-round-br.yml'
  workflow_dispatch:

jobs:
  exact-br:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check exact deep best response against full-tree evaluation
        run: python tools/benchmark_hu_two_round_br.py
