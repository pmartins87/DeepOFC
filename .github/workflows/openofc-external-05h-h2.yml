name: OpenOFC external 05H H2 M provenance

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05H_H2_M_PROVENANCE_COMPLETION_CONTRACT.md'
      - 'tools/openofc_solver/run_external_05h_h2.py'
      - '.github/workflows/openofc-external-05h-h2.yml'
  workflow_dispatch:

jobs:
  h2-m-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      FROZEN_MCCFR_ITERATIONS: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate 05H support and downstream logic
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q \
              tools/openofc_solver/test_external_05h_broad_support.py \
              tools/openofc_solver/test_external_05h_downstream_logic.py
      - name: Compile H2 runner
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile tools/openofc_solver/run_external_05h_h2.py
      - name: Run 05H H2 explicit M provenance
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05h_h2.py \
              --mccfr-iterations "$FROZEN_MCCFR_ITERATIONS" \
              --output artifacts/external_05h_h2.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05h-h2
          path: artifacts/external_05h_h2.json
          if-no-files-found: error
          retention-days: 30
