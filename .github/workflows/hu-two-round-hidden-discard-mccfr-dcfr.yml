name: HU two-round hidden-discard lazy sampled-DCFR

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'deepofc/hu_two_round_mccfr_dcfr.py'
      - 'deepofc/hu_two_round_hidden_discard.py'
      - 'tools/benchmark_hu_two_round_hidden_discard_mccfr_dcfr.py'
      - '.github/workflows/hu-two-round-hidden-discard-mccfr-dcfr.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train lazy sampled-DCFR and exact-BR evaluate current profile
        run: python tools/benchmark_hu_two_round_hidden_discard_mccfr_dcfr.py
