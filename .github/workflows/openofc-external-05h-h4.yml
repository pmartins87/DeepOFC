name: OpenOFC external 05H H4 counterfactual posterior audit

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05H_H4_COUNTERFACTUAL_POSTERIOR_AUDIT_CONTRACT.md'
      - 'tools/openofc_solver/run_external_05h_h4.py'
      - 'tools/openofc_solver/run_external_05g_q3.py'
      - '.github/workflows/openofc-external-05h-h4.yml'
  workflow_dispatch:

jobs:
  h4-counterfactual-posterior-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      FROZEN_MCCFR_ITERATIONS: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate 05H support and posterior-audit dependencies
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q \
              tools/openofc_solver/test_external_05h_broad_support.py \
              tools/openofc_solver/test_external_05h_downstream_logic.py
      - name: Compile H4 runner
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile \
              tools/openofc_solver/run_external_05g_q3.py \
              tools/openofc_solver/run_external_05h_h4.py
      - name: Run 05H H4 exact counterfactual posterior audit
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05h_h4.py \
              --mccfr-iterations "$FROZEN_MCCFR_ITERATIONS" \
              --output artifacts/external_05h_h4.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05h-h4
          path: artifacts/external_05h_h4.json
          if-no-files-found: error
          retention-days: 30
