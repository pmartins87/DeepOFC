name: OpenOFC M5Q visit-weighted Freedman feasibility

on:
  push:
    branches:
      - strategy/m5q-data-dependent-mccfr-bound
    paths:
      - tools/openofc_solver/M5Q_VISIT_WEIGHTED_FREEDMAN_FEASIBILITY_CONTRACT.md
      - tools/openofc_solver/m5q_visit_weighted_freedman_feasibility.py
      - tools/openofc_solver/run_m5q_visit_weighted_freedman_feasibility.py
      - tools/openofc_solver/test_m5q_visit_weighted_freedman_feasibility.py
      - evidence/strategic/m5q_freedman_union_feasibility_2026-08-27.json
      - evidence/strategic/m5q_predictable_visit_variance_2026-08-27.json
      - .github/workflows/openofc-m5q-visit-weighted-freedman-feasibility.yml
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run visit-weighted Freedman mechanics tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5q_visit_weighted_freedman_feasibility.py
      - name: Run frozen visit-weighted Freedman screen
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5q_visit_weighted_freedman_feasibility.py
      - name: Validate authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5q_visit_weighted_freedman_feasibility.json').read_text(encoding='utf-8'))
          summary = data['summary']
          assert data['authority'] == 'VISIT_WEIGHTED_FREEDMAN_FEASIBILITY_PILOT_NOT_CERTIFICATION'
          assert len(data['rows']) == 4
          assert summary['sampled_positive_regret_term_assumed_zero'] is True
          assert summary['frozen_profile_extrapolation_only'] is True
          assert summary['adaptive_training_trajectory_certified'] is False
          assert summary['production_certification_eligible'] is False
          assert summary['real_routes_certified'] == 0
          for row in data['rows']:
              assert row['required_iterations_for_target_concentration_only'] > 0
              assert row['required_iteration_improvement_factor_vs_coarse'] > 1.0
              assert row['production_certification_eligible'] is False
              assert row['real_routes_certified'] == 0
          print('OPENOFC_M5Q_VISIT_WEIGHTED_FREEDMAN_FEASIBILITY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5q-visit-weighted-freedman-feasibility
          path: artifacts/m5q_visit_weighted_freedman_feasibility.json
          if-no-files-found: error
          retention-days: 14
