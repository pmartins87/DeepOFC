name: Sync roadmap R6 first benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-roadmap-r6-first-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roadmap patch
        run: python tools/sync_roadmap_r6_first_benchmark.py
      - name: Persist roadmap if changed
        run: |
          if git diff --quiet -- docs/ROADMAP.md; then
            echo "Roadmap already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "Roadmap: record first exact HU R6 benchmark"
          git push origin HEAD:main
