name: OpenOFC external 06R2A core
on:
  workflow_dispatch:
  push:
    branches: [research/external-ofc-solver-audit-20260827]
    paths:
      - 'tools/openofc_solver/external_06r2a_uniform_information_sampler.py'
      - 'tools/openofc_solver/test_external_06r2a_uniform_information_sampler.py'
      - '.github/workflows/openofc-external-06r2a-core.yml'
permissions:
  contents: read
jobs:
  information-safe-sampler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/external_06r2a_uniform_information_sampler.py
      - name: Test information firewall
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m pytest -q tools/openofc_solver/test_external_06r2a_uniform_information_sampler.py
