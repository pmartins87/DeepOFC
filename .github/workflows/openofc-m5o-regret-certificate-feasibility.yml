name: OpenOFC M5O regret-certificate feasibility

on:
  push:
    branches:
      - strategy/m5o-regret-certificate-feasibility
    paths:
      - deepofc/hu_two_round_cfr.py
      - deepofc/hu_two_round_br.py
      - deepofc/hu_two_round_joker.py
      - tools/openofc_solver/M5O_REGRET_CERTIFICATE_FEASIBILITY_CONTRACT.md
      - tools/openofc_solver/m5o_regret_certificate.py
      - tools/openofc_solver/test_m5o_regret_certificate.py
      - .github/workflows/openofc-m5o-regret-certificate-feasibility.yml
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5O exact regret-bound feasibility tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5o_regret_certificate.py
      - name: Compile M5O implementation
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile \
              deepofc/hu_two_round_cfr.py \
              tools/openofc_solver/m5o_regret_certificate.py
