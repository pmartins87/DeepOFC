name: OpenOFC external two-street infoset Q0

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - '.github/workflows/openofc-external-two-street-q0.yml'
      - 'tools/openofc_solver/external_two_street_infoset_search.py'
      - 'tools/openofc_solver/test_external_two_street_infoset_search.py'
      - 'tools/openofc_solver/external_research_world_sampler.py'
      - 'tools/openofc_solver/strategic_cfr.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  two-street-q0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate 05C mechanical firewalls
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_two_street_infoset_search.py
      - name: Run frozen 05C-Q0 shadow pilot
        run: |
          PYTHONPATH=.:tools/openofc_solver python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from external_two_street_infoset_search import run_two_street_infoset_uct
          from test_external_two_street_infoset_search import _coherent_r3_state, _support_worlds

          worlds = _support_worlds()
          state = _coherent_r3_state(worlds[0])
          result = run_two_street_infoset_uct(
              state,
              worlds,
              iterations=5_000,
              seed=2026082831,
              exploration=1.0,
          )
          layers = {(s.round_index, s.actor) for s in result.layer_stats}
          expected_layers = {(3, 0), (3, 1), (4, 0), (4, 1)}
          paths = [
              "tools/openofc_solver/external_two_street_infoset_search.py",
              "tools/openofc_solver/test_external_two_street_infoset_search.py",
              "tools/openofc_solver/external_research_world_sampler.py",
              "tools/openofc_solver/strategic_cfr.py",
          ]
          payload = {
              "schema": "openofc-external-component-ab-v1",
              "experiment_id": "EXT-ISMCTS-05C-Q0-TWO-STREET",
              "baseline_sha": "c3430819d6cb22c8ad823791a35374d56a88a32a",
              "authority": result.authority,
              "component": "r3-r4-two-street-infoset-tree",
              "files": [
                  {"path": p, "sha256": hashlib.sha256(Path(p).read_bytes()).hexdigest()}
                  for p in paths
              ],
              "search": {
                  "iterations": result.iterations,
                  "seed": result.seed,
                  "support_worlds": result.support_worlds,
                  "selected_root_action_key": result.selected_root_action_key,
                  "infoset_count": result.infoset_count,
                  "fully_explored_infosets": result.fully_explored_infosets,
                  "terminal_mean_p0_utility": result.terminal_mean_p0_utility,
                  "terminal_min_p0_utility": result.terminal_min_p0_utility,
                  "terminal_max_p0_utility": result.terminal_max_p0_utility,
                  "layer_stats": [
                      {
                          "round": s.round_index,
                          "actor": s.actor,
                          "infosets": s.infosets,
                          "total_visits": s.total_visits,
                      }
                      for s in result.layer_stats
                  ],
              },
              "quality": {
                  "all_four_decision_layers_reached": layers == expected_layers,
                  "terminal_episode_count_matches_iterations": result.terminal_episodes == result.iterations,
                  "single_physical_world_per_episode": True,
                  "root_hidden_world_blind": True,
                  "canonical_infoset_keys_only": True,
                  "no_exact_response_helper_inside_search": True,
              },
              "limitations": [
                  "tiny finite support generated from uniform conditional worlds",
                  "support conditions on a frozen hidden prior-discard fixture",
                  "no equilibrium-quality claim",
                  "no posterior conditioning on R0-R2 signalling",
                  "not certification authority",
              ],
              "promotion_recommendation": "CONTINUE_TO_05C_Q1_REPRODUCIBILITY_ONLY",
              "real_routes_certified": 0,
          }
          if not all(payload["quality"].values()):
              raise SystemExit("05C-Q0 mechanical firewall failed")
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["sha256"] = hashlib.sha256(raw).hexdigest()
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/external_two_street_05c_q0.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "experiment_id": payload["experiment_id"],
              "infoset_count": result.infoset_count,
              "fully_explored_infosets": result.fully_explored_infosets,
              "terminal_mean_p0_utility": result.terminal_mean_p0_utility,
              "manifest_sha256": payload["sha256"],
              "real_routes_certified": 0,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-two-street-05c-q0
          path: artifacts/external_two_street_05c_q0.json
          if-no-files-found: error
          retention-days: 30
