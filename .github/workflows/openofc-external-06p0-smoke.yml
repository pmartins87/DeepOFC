name: OpenOFC external 06P0 conditioned IS-UCT smoke

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/external_06p0_conditioned_uct.py'
      - 'tools/openofc_solver/test_external_06p0_conditioned_uct.py'
      - 'tools/openofc_solver/external_06r0_conditioned_solver.py'
      - 'tools/openofc_solver/external_06s0_suit_automorphism.py'
      - 'tools/openofc_solver/strategic_cfr.py'
      - '.github/workflows/openofc-external-06p0-smoke.yml'
  workflow_dispatch:

jobs:
  conditioned-isuct-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate strategic core
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_strategic_cfr.py
      - name: Test conditioned IS-UCT candidate
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_06p0_conditioned_uct.py
      - name: Compile practical search candidate
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile tools/openofc_solver/external_06p0_conditioned_uct.py
