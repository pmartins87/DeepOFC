name: OpenOFC M5O regret-certificate pilot

on:
  push:
    branches:
      - strategy/m5o-regret-certificate-feasibility
    paths:
      - deepofc/hu_two_round.py
      - deepofc/hu_two_round_br.py
      - deepofc/hu_two_round_cfr.py
      - deepofc/hu_two_round_hidden_discard.py
      - deepofc/hu_two_round_joker.py
      - tools/openofc_solver/M5O_REGRET_CERTIFICATE_FEASIBILITY_CONTRACT.md
      - tools/openofc_solver/m5o_regret_certificate.py
      - tools/openofc_solver/run_m5o_regret_certificate_pilot.py
      - tools/openofc_solver/test_m5o_regret_certificate.py
      - .github/workflows/openofc-m5o-regret-certificate-pilot.yml
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Recheck M5O theorem/accounting gate
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5o_regret_certificate.py
      - name: Run frozen exact reduced-game M5O pilot
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5o_regret_certificate_pilot.py
      - name: Validate pilot authority and theorem checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/m5o_regret_certificate_pilot.json').read_text(encoding='utf-8'))
          assert data['schema'] == 'openofc-m5o-regret-certificate-pilot-v1'
          assert data['authority'] == 'REDUCED_GAME_REGRET_BOUND_PILOT_NOT_PRODUCTION_CERTIFICATION'
          assert data['solver_variant'] == 'cfr'
          assert data['family_checkpoints'] == {
              'joker': [1, 2, 4, 8],
              'hidden-discard': [1],
          }
          assert data['summary']['rows'] == 5
          assert data['summary']['families'] == ['hidden-discard', 'joker']
          assert data['summary']['all_bounds_verified'] is True
          assert data['summary']['production_certification_eligible'] is False
          assert data['summary']['mccfr_transfer_claimed'] is False
          for row in data['rows']:
              cert = row['certificate']
              assert cert['authority'] == 'EXACT_FULL_TREE_CFR_REGRET_BOUND_FEASIBILITY_NOT_PRODUCTION_CERTIFICATION'
              assert cert['bound_verified'] is True
              assert cert['nash_conv_upper_bound'] + 1e-8 >= cert['exact_nash_conv']
              assert row['production_certification_eligible'] is False
          print('OPENOFC_M5O_REGRET_CERTIFICATE_PILOT_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5o-regret-certificate-pilot
          path: artifacts/m5o_regret_certificate_pilot.json
          if-no-files-found: error
          retention-days: 14
