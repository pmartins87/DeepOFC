name: OpenOFC M5R three-round reach geometry

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - tools/openofc_solver/M5R_THREE_ROUND_REACH_GEOMETRY_CONTRACT.md
      - tools/openofc_solver/m5r_three_round_reach_geometry.py
      - tools/openofc_solver/run_m5r_three_round_reach_geometry.py
      - .github/workflows/openofc-m5r-three-round-reach-geometry.yml
  workflow_dispatch:

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reach geometry surface
        run: |
          python -m py_compile \
            tools/openofc_solver/m5r_three_round_reach_geometry.py \
            tools/openofc_solver/run_m5r_three_round_reach_geometry.py

  cells:
    needs: mechanics
    strategy:
      fail-fast: false
      matrix:
        family: [three-round-v1, three-round-v2]
        player: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run exact reach geometry cell
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5r_three_round_reach_geometry.py \
              --family '${{ matrix.family }}' \
              --player '${{ matrix.player }}' \
              --output 'artifacts/m5r_reach_geometry_${{ matrix.family }}_p${{ matrix.player }}.json'
      - name: Enforce authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/m5r_reach_geometry_${{ matrix.family }}_p${{ matrix.player }}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["validation_status"] == "PASS"
          assert data["terminal_histories"] == data["expected_terminal_histories"]
          assert data["candidate_opponent_children"] > 0
          assert data["distinct_positive_reach_levels"] > 0
          assert data["min_positive_reach"] > 0.0
          assert data["responding_player_probability_multiplications"] == 0
          assert data["pruning_executed"] is False
          assert data["production_certification_eligible"] is False
          assert data["real_routes_certified"] == 0
          print("OPENOFC_M5R_REACH_GEOMETRY_CELL=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m5r-reach-geometry-${{ matrix.family }}-p${{ matrix.player }}
          path: artifacts/m5r_reach_geometry_${{ matrix.family }}_p${{ matrix.player }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m5r-reach-geometry-*
          path: reach-artifacts
          merge-multiple: true
      - name: Freeze reach geometry result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = sorted(Path("reach-artifacts").glob("*.json"))
          assert len(paths) == 4, paths
          cells = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          expected = {
              ("three-round-v1", 0), ("three-round-v1", 1),
              ("three-round-v2", 0), ("three-round-v2", 1),
          }
          assert {(c["family"], c["player"]) for c in cells} == expected
          assert all(c["validation_status"] == "PASS" for c in cells)
          assert all(c["terminal_histories"] == c["expected_terminal_histories"] for c in cells)
          assert all(c["responding_player_probability_multiplications"] == 0 for c in cells)
          assert all(c["pruning_executed"] is False for c in cells)

          union = {}
          for cell in cells:
              for row in cell["positive_reach_levels"]:
                  prior = union.setdefault(row["float_hex"], {"value": row["value"], "count": 0})
                  assert prior["value"] == row["value"]
                  prior["count"] += row["count"]
          union_rows = [
              {"float_hex": key, "value": row["value"], "count": row["count"]}
              for key, row in union.items()
          ]
          union_rows.sort(key=lambda row: (row["value"], row["float_hex"]))

          payload = {
              "schema": "openofc-m5r-three-round-reach-geometry-aggregate-v1",
              "authority": "M5R_REDUCED_EXACT_REACH_GEOMETRY_ONLY",
              "cells": cells,
              "summary": {
                  "cells": 4,
                  "candidate_opponent_children": sum(c["candidate_opponent_children"] for c in cells),
                  "zero_reach_candidates": sum(c["zero_reach_candidates"] for c in cells),
                  "union_distinct_positive_reach_levels": len(union_rows),
                  "global_min_positive_reach": union_rows[0]["value"],
                  "global_max_positive_reach": union_rows[-1]["value"],
                  "positive_reach_levels_union": union_rows,
              },
              "decision": {
                  "reach_geometry_validated": True,
                  "calibrated_interval_frontier_executed": False,
                  "full_game_scalable_evaluator_validated": False,
                  "production_certification_eligible": False,
                  "real_routes_certified": 0,
                  "next_blocker": "PRE_FREEZE_CALIBRATED_THRESHOLD_FRONTIER_FROM_OBSERVED_DISCRETE_REACH_BREAKPOINTS",
              },
              "verdict": "PASS_M5R_THREE_ROUND_REACH_GEOMETRY",
              "production_certification_eligible": False,
              "real_routes_certified": 0,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          payload["sha256"] = hashlib.sha256(raw).hexdigest()
          out = Path("artifacts/m5r_three_round_reach_geometry.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "verdict": payload["verdict"],
              "summary": payload["summary"],
              "sha256": payload["sha256"],
              "next_blocker": payload["decision"]["next_blocker"],
              "real_routes_certified": 0,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5r-three-round-reach-geometry
          path: artifacts/m5r_three_round_reach_geometry.json
          if-no-files-found: error
          retention-days: 30
