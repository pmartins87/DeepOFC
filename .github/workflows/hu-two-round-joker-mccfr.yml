name: HU two-round physical-Joker external-sampling MCCFR

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'deepofc/hu_two_round_joker.py'
      - 'tools/benchmark_hu_two_round_joker_mccfr.py'
      - '.github/workflows/hu-two-round-joker-mccfr.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train external-sampling MCCFR on physical-Joker benchmark
        run: python tools/benchmark_hu_two_round_joker_mccfr.py
