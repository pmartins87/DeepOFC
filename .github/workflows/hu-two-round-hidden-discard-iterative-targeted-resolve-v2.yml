name: HU two-round iterative BR-guided trembled re-solve v2

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'deepofc/hu_two_round_resolve.py'
      - 'deepofc/hu_two_round_hidden_discard.py'
      - 'tools/benchmark_hu_two_round_hidden_discard_iterative_targeted_resolve_v2.py'
      - '.github/workflows/hu-two-round-hidden-discard-iterative-targeted-resolve-v2.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two globally gated BR-guided repair rounds, skipping solved subgames
        run: python -u tools/benchmark_hu_two_round_hidden_discard_iterative_targeted_resolve_v2.py
