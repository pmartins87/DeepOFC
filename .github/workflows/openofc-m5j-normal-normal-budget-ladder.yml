name: OpenOFC M5J Normal-Normal budget ladder

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/run_m5j_normal_normal_budget_ladder.py
      - .github/workflows/openofc-m5j-normal-normal-budget-ladder.yml
  workflow_dispatch:

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5J budget ladder
        run: |
          PYTHONPATH=tools/openofc_solver \
            python tools/openofc_solver/run_m5j_normal_normal_budget_ladder.py
      - name: Validate fail-closed screening identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/m5j_normal_normal_budget_ladder.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['authority'] == 'BUDGET_LADDER_DIAGNOSTIC_NOT_CERTIFICATION'
          assert data['summary']['rows'] == 8
          assert data['summary']['ready_for_real_bellman'] == 0
          assert data['summary']['certification_claimed'] is False
          assert all(
              row['promotion_allowed'] is False
              and row['m5c_evidence']['evidence_kind'] == 'HELD_OUT_SCREENING_ONLY'
              for row in data['rows']
          )
          expected = {
              (state, candidate, response)
              for state in ('B0:P0F0:P1F0', 'B1:P0F0:P1F0')
              for candidate in (256, 1024)
              for response in (256, 1024)
          }
          actual = {
              (row['state'], row['candidate_budget'], row['response_budget'])
              for row in data['rows']
          }
          assert actual == expected
          print('OPENOFC_M5J_LADDER_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5j-normal-normal-budget-ladder
          path: artifacts/m5j_normal_normal_budget_ladder.json
          if-no-files-found: error
          retention-days: 14
