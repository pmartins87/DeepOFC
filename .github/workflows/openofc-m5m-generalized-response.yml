name: OpenOFC M5M generalized response gate

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/M5M_GENERALIZED_RESPONSE_SCREENING_CONTRACT.md
      - tools/openofc_solver/m5m_generalized_response_screening.py
      - tools/openofc_solver/test_m5m_generalized_response_screening.py
      - .github/workflows/openofc-m5m-generalized-response.yml
  workflow_dispatch:

jobs:
  generalized-response:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5M generalized-response tests
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5m_generalized_response_screening.py
      - name: Compile M5M implementation
        run: |
          python -m py_compile tools/openofc_solver/m5m_generalized_response_screening.py
