name: OpenOFC M5H normal held-out evidence

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/M5H_NORMAL_HELDOUT_EVIDENCE_CONTRACT.md
      - tools/openofc_solver/m5h_normal_heldout_evidence.py
      - tools/openofc_solver/test_m5h_normal_heldout_evidence.py
      - .github/workflows/openofc-m5h-normal-heldout-evidence.yml
  workflow_dispatch:

jobs:
  m5h-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5H normal held-out evidence tests
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5h_normal_heldout_evidence.py
      - name: Compile M5H implementation
        run: python -m py_compile tools/openofc_solver/m5h_normal_heldout_evidence.py
