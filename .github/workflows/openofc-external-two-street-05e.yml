name: OpenOFC external two-street 05E exact exploitability

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - '.github/workflows/openofc-external-two-street-05e.yml'
      - 'tools/openofc_solver/run_external_two_street_05e.py'
      - 'tools/openofc_solver/external_two_street_exact_br.py'
      - 'tools/openofc_solver/test_external_two_street_exact_br.py'
      - 'tools/openofc_solver/EXTERNAL_TWO_STREET_05E_EXACT_BR_CONTRACT.md'
      - 'tools/openofc_solver/external_two_street_counterfactual_resolve.py'
      - 'tools/openofc_solver/external_two_street_infoset_search.py'
      - 'tools/openofc_solver/external_two_street_mccfr.py'
      - 'tools/openofc_solver/strategic_cfr.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  exact-reduced-game-exploitability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate exact BR mechanics
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_two_street_exact_br.py
      - name: Run full six-world 05E exact exploitability
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_two_street_05e.py \
              --output artifacts/external_two_street_05e.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-two-street-05e
          path: artifacts/external_two_street_05e.json
          if-no-files-found: error
          retention-days: 30
