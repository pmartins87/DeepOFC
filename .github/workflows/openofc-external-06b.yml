name: OpenOFC external 06B full-game tabular learnability

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_06B_FULL_GAME_LEARNABILITY_GATE_CONTRACT.md'
      - 'tools/openofc_solver/run_external_06b.py'
      - 'tools/openofc_solver/strategic_cfr.py'
      - '.github/workflows/openofc-external-06b.yml'
  workflow_dispatch:

jobs:
  tabular-learnability:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate certified full-game mechanics
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_strategic_cfr.py
      - name: Compile 06B runner
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile tools/openofc_solver/run_external_06b.py
      - name: Run frozen 06B recurrence diagnostic
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_06b.py \
              --output artifacts/external_06b.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-06b
          path: artifacts/external_06b.json
          if-no-files-found: error
          retention-days: 30
