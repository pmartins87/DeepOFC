name: OpenOFC M5N runtime calibration

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/run_m5n_normal_fantasy_runtime_calibration.py
      - .github/workflows/openofc-m5n-runtime-calibration.yml
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Recheck M5N paired mechanics
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5n_normal_fantasy_paired_screening.py
      - name: Run phase-timed M5N calibration
        run: |
          PYTHONPATH=tools/openofc_solver \
            python tools/openofc_solver/run_m5n_normal_fantasy_runtime_calibration.py
      - name: Validate calibration authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5n_normal_fantasy_runtime_calibration.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'RUNTIME_CALIBRATION_NOT_STRATEGIC_EVIDENCE'
          assert data['source_timeout_run'] == 33089463461
          assert data['summary']['original_pilot_strategic_result_available'] is False
          assert data['summary']['calibration_is_strategic_evidence'] is False
          assert data['summary']['production_certification_eligible'] is False
          assert data['summary']['real_routes_certified'] == 0
          assert data['timings']['total_measured_seconds'] > 0.0
          print('OPENOFC_M5N_RUNTIME_CALIBRATION_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5n-runtime-calibration
          path: artifacts/m5n_normal_fantasy_runtime_calibration.json
          if-no-files-found: error
          retention-days: 14
