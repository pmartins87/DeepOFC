name: OpenOFC external 05H downstream core validation

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/run_external_05h_h2.py'
      - 'tools/openofc_solver/run_external_05h_h3.py'
      - 'tools/openofc_solver/run_external_05h_h4.py'
      - '.github/workflows/openofc-external-05h-downstream-core.yml'
  workflow_dispatch:

jobs:
  downstream-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile prepared 05H downstream runners
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile \
            tools/openofc_solver/run_external_05h_h2.py \
            tools/openofc_solver/run_external_05h_h3.py \
            tools/openofc_solver/run_external_05h_h4.py
      - name: Revalidate support and completion cores
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q \
              tools/openofc_solver/test_external_05h_broad_support.py \
              tools/openofc_solver/test_external_05g_uniform_backward_completion.py
