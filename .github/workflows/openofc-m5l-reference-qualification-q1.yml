name: OpenOFC M5L reference qualification Q1

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - deepofc/hu_three_round_br.py
      - deepofc/hu_three_round_mccfr.py
      - deepofc/hu_three_round_sequential.py
      - tools/openofc_solver/M5L_REFERENCE_EVALUATOR_QUALIFICATION_CONTRACT.md
      - tools/openofc_solver/run_m5l_three_round_q0.py
      - tools/openofc_solver/run_m5l_three_round_q1.py
      - .github/workflows/openofc-m5l-reference-qualification-q1.yml
  workflow_dispatch:

jobs:
  q1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5L multi-profile exact-BR calibration
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5l_three_round_q1.py
      - name: Validate Q1 remains calibration-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/m5l_three_round_q1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['authority'] == 'MULTI_PROFILE_CALIBRATION_NOT_CERTIFICATION'
          assert data['qualification_stage'] == 'Q1_MULTI_PROFILE_CALIBRATION'
          assert data['response_budget'] == 1024
          assert data['summary']['rows'] == 16
          assert data['summary']['certification_eligible'] is False
          assert data['summary']['reference_manifest_emitted'] is False
          assert set(data['summary']['profiles']) == {
              'uniform', 'lexicographic-pure', 'hash-biased-mixed', 'mccfr-1024'
          }
          assert {row['player'] for row in data['rows']} == {0, 1}
          assert len({row['response_seed'] for row in data['rows']}) == 2
          assert all(row['underestimation_residual'] >= 0.0 for row in data['rows'])
          assert all(
              abs(row['exact_best_response_value'] - row['exact_replay_value']) <= 1e-10
              for row in data['rows']
          )
          print('OPENOFC_M5L_Q1_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5l-reference-qualification-q1
          path: artifacts/m5l_three_round_q1.json
          if-no-files-found: error
          retention-days: 14
