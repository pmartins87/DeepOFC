name: HU three-round work-normalized training cost

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/sequential.py'
      - 'deepofc/hu_three_round_sequential.py'
      - 'deepofc/hu_three_round_cfr.py'
      - 'deepofc/hu_three_round_mccfr.py'
      - 'tools/benchmark_hu_three_round_training_work.py'
      - '.github/workflows/hu-three-round-training-work.yml'
  workflow_dispatch:

jobs:
  fulltree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train one exact full-tree DCFR iteration
        run: python -u tools/benchmark_hu_three_round_training_work.py --mode fulltree

  external:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train exactly equal terminal-work external sampling
        run: python -u tools/benchmark_hu_three_round_training_work.py --mode external
