name: OpenOFC R4 cached oracle grouping regression
on:
  workflow_dispatch:
  push:
    branches: [research/external-ofc-solver-audit-20260827]
    paths:
      - '.github/workflows/openofc-r4-cached-oracle-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/r4_exact_oracle_cached.py tools/openofc_solver/validate_r4_cached_oracle_grouping.py
      - name: Validate grouped cached oracle
        run: |
          PYTHONPATH=.:tools/openofc_solver python tools/openofc_solver/validate_r4_cached_oracle_grouping.py --output artifacts/r4_cached_oracle_grouping_regression.json
      - uses: actions/upload-artifact@v4
        with:
          name: r4-cached-oracle-grouping-regression
          path: artifacts/r4_cached_oracle_grouping_regression.json
          if-no-files-found: error
          retention-days: 90
