name: OpenOFC external 06S1 suit-canonical reuse A/B

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_06S1_SUIT_CANONICAL_TABULAR_REUSE_CONTRACT.md'
      - 'tools/openofc_solver/external_06s0_suit_automorphism.py'
      - 'tools/openofc_solver/external_06s1_suit_canonical_solver.py'
      - 'tools/openofc_solver/run_external_06s0.py'
      - 'tools/openofc_solver/run_external_06s1.py'
      - 'tools/openofc_solver/strategic_cfr.py'
      - '.github/workflows/openofc-external-06s1.yml'
  workflow_dispatch:

jobs:
  suit-canonical-reuse-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate 06A strategic mechanics
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_strategic_cfr.py
      - name: Revalidate 06S0 exact suit automorphism
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_06s0.py \
              --output artifacts/external_06s0_revalidation.json
      - name: Compile 06S1 research solver and runner
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m py_compile \
              tools/openofc_solver/external_06s1_suit_canonical_solver.py \
              tools/openofc_solver/run_external_06s1.py
      - name: Run frozen 06S1 lossless suit-canonical recurrence A/B
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_06s1.py \
              --output artifacts/external_06s1.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-06s1
          path: |
            artifacts/external_06s0_revalidation.json
            artifacts/external_06s1.json
          if-no-files-found: error
          retention-days: 30
