name: OpenOFC external 06R3 smoke
on:
  workflow_dispatch:
  push:
    branches: [research/external-ofc-solver-audit-20260827]
    paths:
      - '.github/workflows/openofc-external-06r3-smoke.yml'
      - 'tools/openofc_solver/v2_information_set_uct.py'
      - 'tools/openofc_solver/test_external_06r3_v2_isuct.py'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile 06R3 candidate
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/v2_information_set_uct.py tools/openofc_solver/run_external_06r3_v2.py
      - name: Run information-firewall smoke tests
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m pytest -q tools/openofc_solver/test_external_06r3_v2_isuct.py
