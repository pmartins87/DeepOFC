name: HU two-round public-state round4 re-solve

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'deepofc/hu_two_round_resolve.py'
      - 'tools/benchmark_hu_two_round_public_resolve.py'
      - '.github/workflows/hu-two-round-public-resolve.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Condition on public round3 state and exact-BR evaluate round4 re-solving
        run: python tools/benchmark_hu_two_round_public_resolve.py
