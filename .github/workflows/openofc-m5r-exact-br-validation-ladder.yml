name: OpenOFC M5R exact BR validation ladder

on:
  push:
    branches:
      - strategy/m5r-frozen-policy-br-certification
    paths:
      - tools/openofc_solver/M5R_EXACT_BR_VALIDATION_LADDER_CONTRACT.md
      - tools/openofc_solver/run_m5r_exact_br_validation_ladder_case.py
      - .github/workflows/openofc-m5r-exact-br-validation-ladder.yml
  workflow_dispatch:

jobs:
  ladder:
    strategy:
      fail-fast: false
      matrix:
        family: [three-round-v1, three-round-v2]
        player: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run exact BR ladder case
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5r_exact_br_validation_ladder_case.py \
              --family '${{ matrix.family }}' \
              --player '${{ matrix.player }}' \
              --output 'artifacts/m5r_br_ladder_${{ matrix.family }}_p${{ matrix.player }}.json'
      - name: Validate case firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/m5r_br_ladder_${{ matrix.family }}_p${{ matrix.player }}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["authority"] == "M5R_EXACT_THREE_ROUND_BR_VALIDATION_LADDER_NOT_ROUTE_CERTIFICATION"
          assert data["validation_status"] == "PASS"
          assert data["crosscheck_abs_error"] <= 1e-10
          assert data["responding_infosets"] == data["expected_responding_infosets"]
          assert data["exact_br_terminal_histories"] == data["expected_exact_br_terminal_histories"]
          assert data["pure_replay_terminal_histories"] == data["expected_pure_replay_terminal_histories"]
          assert data["production_certification_eligible"] is False
          assert data["real_routes_certified"] == 0
          print("OPENOFC_M5R_EXACT_BR_LADDER_CASE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m5r-br-ladder-${{ matrix.family }}-p${{ matrix.player }}
          path: artifacts/m5r_br_ladder_${{ matrix.family }}_p${{ matrix.player }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m5r-br-ladder-*
          path: ladder-artifacts
          merge-multiple: true
      - name: Freeze ladder summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = sorted(Path("ladder-artifacts").glob("*.json"))
          assert len(files) == 4, files
          rows = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          assert all(row["validation_status"] == "PASS" for row in rows)
          assert all(row["crosscheck_abs_error"] <= 1e-10 for row in rows)
          pairs = {(row["family"], row["player"]) for row in rows}
          assert pairs == {
              ("three-round-v1", 0), ("three-round-v1", 1),
              ("three-round-v2", 0), ("three-round-v2", 1),
          }
          payload = {
              "schema": "openofc-m5r-exact-br-validation-ladder-v1",
              "authority": "M5R_EXACT_BR_VALIDATION_LADDER_NOT_ROUTE_CERTIFICATION",
              "rows": rows,
              "decision": {
                  "exact_reference_ladder_validated": True,
                  "families": 2,
                  "player_cases": 4,
                  "full_game_scalable_evaluator_validated": False,
                  "next_blocker": "SCALABLE_EVALUATOR_WITH_INDEPENDENT_MISSED_DEVIATION_UPPER_BOUND_MISSING",
                  "production_certification_eligible": False,
                  "real_routes_certified": 0,
              },
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          payload["sha256"] = hashlib.sha256(raw).hexdigest()
          out = Path("artifacts/m5r_exact_br_validation_ladder.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "sha256": payload["sha256"],
              "br_values": {f'{r["family"]}:p{r["player"]}': r["exact_br_value"] for r in rows},
              "max_crosscheck_abs_error": max(r["crosscheck_abs_error"] for r in rows),
              "next_blocker": payload["decision"]["next_blocker"],
              "real_routes_certified": 0,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5r-exact-br-validation-ladder
          path: artifacts/m5r_exact_br_validation_ladder.json
          if-no-files-found: error
          retention-days: 30
