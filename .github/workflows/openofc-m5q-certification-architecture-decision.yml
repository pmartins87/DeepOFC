name: OpenOFC M5Q certification architecture decision

on:
  push:
    branches:
      - strategy/m5q-data-dependent-mccfr-bound
    paths:
      - docs/M5Q_CERTIFICATION_ARCHITECTURE_DECISION_2026-08-27.md
      - tools/openofc_solver/m5q_certification_architecture_decision.py
      - tools/openofc_solver/run_m5q_certification_architecture_decision.py
      - tools/openofc_solver/test_m5q_certification_architecture_decision.py
      - .github/workflows/openofc-m5q-certification-architecture-decision.yml
  workflow_dispatch:

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run architecture-decision tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5q_certification_architecture_decision.py
      - name: Materialize frozen architecture decision
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5q_certification_architecture_decision.py
      - name: Validate fail-closed decision firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5q_certification_architecture_decision.json').read_text(encoding='utf-8'))
          report = data['report']
          decision = report['decision']
          assert report['authority'] == 'M5Q_CERTIFICATION_ARCHITECTURE_DECISION_NOT_STRATEGIC_CERTIFICATION'
          assert decision['global_floor_exploration_status'] == 'DEPRIORITIZED_AS_PRIMARY_PRODUCTION_CERTIFICATE'
          assert decision['scalar_coordinate_freedman_status'] == 'DEPRIORITIZED_AS_PRIMARY_PRODUCTION_CERTIFICATE'
          assert decision['preferred_next_architecture'] == 'FROZEN_POLICY_INDEPENDENT_DEVIATION_BEST_RESPONSE_CERTIFICATION'
          assert decision['support_free_methods_globally_rejected'] is False
          assert report['production_solver_modified'] is False
          assert report['production_certification_eligible'] is False
          assert report['real_routes_certified'] == 0
          assert report['exploration_epsilon1']['joker_required_iterations_for_target'] == 918799060363021
          assert report['exploration_epsilon1']['hidden_discard_required_iterations_for_target'] == 1382605782910640640
          assert report['adaptive_predictable_freedman_checkpoint']['concentration_to_exact_exploitability_ratio'] > 8700.0
          assert data['next_milestone']['id'] == 'M5R'
          print('OPENOFC_M5Q_CERTIFICATION_ARCHITECTURE_DECISION=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5q-certification-architecture-decision
          path: artifacts/m5q_certification_architecture_decision.json
          if-no-files-found: error
          retention-days: 30
