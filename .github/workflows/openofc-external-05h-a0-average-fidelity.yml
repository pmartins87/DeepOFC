name: OpenOFC external 05H A0 MCCFR average fidelity

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05H_A0_MCCFR_AVERAGE_FIDELITY_CONTRACT.md'
      - 'tools/openofc_solver/external_05h_mccfr_simple_average.py'
      - 'tools/openofc_solver/test_external_05h_mccfr_simple_average.py'
      - '.github/workflows/openofc-external-05h-a0-average-fidelity.yml'
  workflow_dispatch:

jobs:
  a0-average-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile average-policy implementation
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile \
            tools/openofc_solver/external_05h_mccfr_simple_average.py
      - name: Run average-policy fidelity tests
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_05h_mccfr_simple_average.py
