name: OpenOFC M5I archive evidence once

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - .github/workflows/openofc-m5i-archive-evidence-once.yml

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy/m5h-normal-heldout-evidence
          fetch-depth: 0
      - name: Download immutable M5I pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/m5i-archive
          mkdir -p /tmp/m5i-archive
          gh run download 33081320142 \
            --repo pmartins87/DeepOFC \
            --name openofc-m5i-normal-normal-screening-pilot \
            --dir /tmp/m5i-archive
          test -f /tmp/m5i-archive/m5i_normal_normal_pilot.json
      - name: Verify raw and canonical payload identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('/tmp/m5i-archive/m5i_normal_normal_pilot.json')
          raw_sha = hashlib.sha256(p.read_bytes()).hexdigest()
          assert raw_sha == 'af117b164a781820f9748b374c9e0f86c6ee676a829a9d7ebe213e4f540fb5ad', raw_sha
          data = json.loads(p.read_text(encoding='utf-8'))
          expected = data['sha256']
          unsigned = dict(data)
          unsigned.pop('sha256')
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('utf-8')
          actual = hashlib.sha256(canonical).hexdigest()
          assert expected == 'b9ea9a555b2bc5ab9aee52476006ed035877b10e1a8830d6cd630673d464098c'
          assert actual == expected, (actual, expected)
          assert data['authority'] == 'SCREENING_PILOT_NOT_CERTIFICATION'
          assert data['summary']['ready_for_real_bellman'] == 0
          assert data['summary']['certification_claimed'] is False
          print('OPENOFC_M5I_ARCHIVE_IDENTITY=PASS')
          PY
      - name: Persist exact evidence and remove one-shot workflow
        run: |
          mkdir -p evidence/strategic
          cp /tmp/m5i-archive/m5i_normal_normal_pilot.json \
            evidence/strategic/m5i_normal_normal_pilot_2026-08-27.json
          git rm .github/workflows/openofc-m5i-archive-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/strategic/m5i_normal_normal_pilot_2026-08-27.json
          git commit -m 'OpenOFC M5I: preserve raw pilot evidence'
          git push origin HEAD:strategy/m5h-normal-heldout-evidence
