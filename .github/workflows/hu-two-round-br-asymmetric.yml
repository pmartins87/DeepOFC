name: HU two-round asymmetric best response

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_br.py'
      - 'tools/benchmark_hu_two_round_br_asymmetric.py'
      - '.github/workflows/hu-two-round-br-asymmetric.yml'
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check deep best response on deterministic asymmetric profile
        run: python tools/benchmark_hu_two_round_br_asymmetric.py
