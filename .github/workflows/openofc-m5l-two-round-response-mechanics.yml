name: OpenOFC M5L two-round response mechanics

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/m5l_two_round_response.py
      - tools/openofc_solver/test_m5l_two_round_response.py
      - .github/workflows/openofc-m5l-two-round-response-mechanics.yml
  workflow_dispatch:

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run M5L two-round response tests
        run: |
          PYTHONPATH=tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5l_two_round_response.py
      - name: Compile calibration learner
        run: python -m py_compile tools/openofc_solver/m5l_two_round_response.py
