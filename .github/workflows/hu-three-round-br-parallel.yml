name: HU three-round exact BR parallel

on:
  workflow_dispatch:

jobs:
  br:
    strategy:
      fail-fast: false
      matrix:
        player: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact player best response and sparse pure replay cross-check
        run: python -u tools/benchmark_hu_three_round_br_player.py --player ${{ matrix.player }}
