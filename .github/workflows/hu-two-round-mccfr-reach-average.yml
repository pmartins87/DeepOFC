name: HU two-round external-sampling reach average

on:
  push:
    branches: [main]
    paths:
      - 'deepofc/hu_two_round.py'
      - 'deepofc/hu_two_round_mccfr.py'
      - 'deepofc/hu_two_round_mccfr_reach_average.py'
      - 'tools/benchmark_hu_two_round_mccfr_reach_average.py'
      - '.github/workflows/hu-two-round-mccfr-reach-average.yml'
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare lazy reach-weighted CFR average with brute five-iteration reference
        run: python tools/benchmark_hu_two_round_mccfr_reach_average.py
