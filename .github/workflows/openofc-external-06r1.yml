name: OpenOFC external 06R1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r4-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m py_compile tools/openofc_solver/external_06r1_belief_correct.py tools/openofc_solver/run_external_06r1.py
      - name: Test
        run: |
          PYTHONPATH=.:tools/openofc_solver python -m pytest -q tools/openofc_solver/test_engine.py tools/openofc_solver/test_strategic_cfr.py tools/openofc_solver/test_external_06r0_conditioned_solver.py tools/openofc_solver/test_external_06p0_conditioned_uct.py tools/openofc_solver/test_external_06r1_belief_correct.py
      - name: Run benchmark
        run: |
          PYTHONPATH=.:tools/openofc_solver python tools/openofc_solver/run_external_06r1.py --output artifacts/external_06r1.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-06r1-belief-correct-r4-strength-compute
          path: artifacts/external_06r1.json
          if-no-files-found: error
          retention-days: 90
