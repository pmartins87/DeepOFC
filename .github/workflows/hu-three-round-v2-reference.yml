name: HU three-round sequential V2 exact reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hu-three-round-v2-reference.yml'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify V2 sequence count, terminal count and exhaustive symmetry
        run: python -u tools/benchmark_hu_three_round_sequential_v2_reference.py
