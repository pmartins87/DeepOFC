name: OpenOFC M5L two-round response exact-BR smoke

on:
  push:
    branches:
      - strategy/m5h-normal-heldout-evidence
    paths:
      - tools/openofc_solver/run_m5l_two_round_response_smoke.py
      - .github/workflows/openofc-m5l-two-round-response-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run base two-round exact-BR response smoke
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5l_two_round_response_smoke.py
      - name: Validate smoke authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/m5l_two_round_response_smoke.json').read_text(encoding='utf-8'))
          assert data['authority'] == 'TWO_ROUND_RESPONSE_MECHANICS_SMOKE_NOT_Q2_NOT_CERTIFICATION'
          assert data['benchmark'] == 'BASE_TWO_ROUND_MECHANICS_ONLY_EXCLUDED_FROM_Q2_HELDOUT'
          assert data['summary']['rows'] == 2
          assert data['summary']['certification_eligible'] is False
          assert data['summary']['q2_evidence'] is False
          assert all(row['underestimation_residual'] >= 0.0 for row in data['rows'])
          print('OPENOFC_M5L_TWO_ROUND_RESPONSE_SMOKE_FIREWALL=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5l-two-round-response-smoke
          path: artifacts/m5l_two_round_response_smoke.json
          if-no-files-found: error
          retention-days: 14
