name: OpenOFC M5R deep opponent-branch BR interval

on:
  push:
    branches:
      - strategy/m5r-frozen-policy-br-certification
    paths:
      - tools/openofc_solver/M5R_DEEP_BRANCH_BR_INTERVAL_CONTRACT.md
      - tools/openofc_solver/m5r_deep_branch_br_interval.py
      - tools/openofc_solver/test_m5r_deep_branch_br_interval.py
      - tools/openofc_solver/run_m5r_deep_branch_br_interval_case.py
      - .github/workflows/openofc-m5r-deep-branch-br-interval.yml
  workflow_dispatch:

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate deep-branch interval mechanics
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_m5r_deep_branch_br_interval.py

  cases:
    needs: mechanics
    strategy:
      fail-fast: false
      matrix:
        family: [joker, hidden-discard]
        player: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run deep-branch interval case
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_m5r_deep_branch_br_interval_case.py \
              --family '${{ matrix.family }}' \
              --player '${{ matrix.player }}' \
              --output 'artifacts/m5r_deep_${{ matrix.family }}_p${{ matrix.player }}.json'
      - name: Validate authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/m5r_deep_${{ matrix.family }}_p${{ matrix.player }}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          decision = data["decision"]
          rows = data["rows"]
          assert data["authority"] == "RIGOROUS_DEEP_BRANCH_BR_INTERVAL_PILOT_NOT_ROUTE_CERTIFICATION"
          assert decision["rigorous_deep_branch_remainder_bound_validated_on_case"] is True
          assert decision["cold_terminal_call_count_matches_reported_work"] is True
          assert decision["deep_only_pruning_point_observed"] is True
          assert all(row["contains_exact_br"] for row in rows)
          assert all(row["contains_exact_deviation_gain"] for row in rows)
          assert all(row["observed_terminal_u0_invocations"] == row["resolved_terminal_histories"] for row in rows)
          assert decision["full_game_scalable_evaluator_validated"] is False
          assert decision["production_certification_eligible"] is False
          assert decision["real_routes_certified"] == 0
          print("OPENOFC_M5R_DEEP_BRANCH_CASE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m5r-deep-${{ matrix.family }}-p${{ matrix.player }}
          path: artifacts/m5r_deep_${{ matrix.family }}_p${{ matrix.player }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m5r-deep-*
          path: deep-artifacts
          merge-multiple: true
      - name: Freeze M5R-E summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = sorted(Path("deep-artifacts").glob("*.json"))
          assert len(files) == 4, files
          cases = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          pairs = {(case["family"], case["player"]) for case in cases}
          assert pairs == {
              ("joker", 0), ("joker", 1),
              ("hidden-discard", 0), ("hidden-discard", 1),
          }
          summary = {}
          for case in cases:
              deep_rows = [
                  row for row in case["rows"]
                  if row["pruned_round3_prefixes"] == 0
                  and (row["pruned_round4_opponent_branches"] > 0 or row["pruned_terminal_opponent_actions"] > 0)
              ]
              assert deep_rows
              best = min(deep_rows, key=lambda row: row["terminal_work_fraction"])
              summary[f'{case["family"]}:p{case["player"]}'] = {
                  "threshold_multiplier_of_chance": best["threshold_multiplier_of_chance"],
                  "terminal_work_fraction": best["terminal_work_fraction"],
                  "interval_width": best["interval_width"],
                  "upper_deviation_gain": best["upper_deviation_gain"],
                  "resolved_terminal_histories": best["resolved_terminal_histories"],
                  "skipped_terminal_histories": best["skipped_terminal_histories"],
              }
          payload = {
              "schema": "openofc-m5r-deep-branch-br-interval-pilot-v1",
              "authority": "RIGOROUS_DEEP_BRANCH_BR_INTERVAL_PILOT_NOT_ROUTE_CERTIFICATION",
              "cases": cases,
              "best_deep_only_points": summary,
              "decision": {
                  "deep_opponent_branch_pruning_validated": True,
                  "cold_terminal_work_reduction_validated": True,
                  "full_game_scalable_evaluator_validated": False,
                  "production_certification_eligible": False,
                  "real_routes_certified": 0,
                  "next_blocker": "TARGET_DRIVEN_MISSED_DEVIATION_BUDGET_CONTROLLER_AND_FULL_GAME_TRANSFER_MISSING",
              },
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          payload["sha256"] = hashlib.sha256(raw).hexdigest()
          out = Path("artifacts/m5r_deep_branch_br_interval_pilot.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "sha256": payload["sha256"],
              "best_deep_only_points": summary,
              "next_blocker": payload["decision"]["next_blocker"],
              "real_routes_certified": 0,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-m5r-deep-branch-br-interval-pilot
          path: artifacts/m5r_deep_branch_br_interval_pilot.json
          if-no-files-found: error
          retention-days: 30
