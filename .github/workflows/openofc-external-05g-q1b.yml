name: OpenOFC external 05G Q1B explicit completion

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05G_Q1B_UNIFORM_BACKWARD_COMPLETION_CONTRACT.md'
      - 'tools/openofc_solver/external_05g_uniform_backward_completion.py'
      - 'tools/openofc_solver/run_external_05g_q1a.py'
      - 'tools/openofc_solver/run_external_05g_q1b.py'
      - '.github/workflows/openofc-external-05g-q1b.yml'
  workflow_dispatch:

jobs:
  q1b-explicit-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Revalidate completion core
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_05g_uniform_backward_completion.py
      - name: Run 05G Q1B explicit completion gate
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05g_q1b.py \
              --output artifacts/external_05g_q1b.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05g-q1b
          path: artifacts/external_05g_q1b.json
          if-no-files-found: error
          retention-days: 30
