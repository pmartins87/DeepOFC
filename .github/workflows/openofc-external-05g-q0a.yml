name: OpenOFC external 05G Q0A broad hidden-information geometry

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/EXTERNAL_05G_BROAD_HIDDEN_INFORMATION_CONTRACT.md'
      - 'tools/openofc_solver/external_05g_broad_support.py'
      - 'tools/openofc_solver/test_external_05g_broad_support.py'
      - 'tools/openofc_solver/run_external_05g_q0a.py'
      - '.github/workflows/openofc-external-05g-q0a.yml'
  workflow_dispatch:

jobs:
  q0a-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate frozen 05G support firewalls
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_05g_broad_support.py
      - name: Run 05G Q0A exact support geometry
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python tools/openofc_solver/run_external_05g_q0a.py \
              --output artifacts/external_05g_q0a.json
      - uses: actions/upload-artifact@v4
        with:
          name: openofc-external-05g-q0a
          path: artifacts/external_05g_q0a.json
          if-no-files-found: error
          retention-days: 30
