name: OpenOFC external 05F Q3 reach-weighted completion smoke

on:
  push:
    branches:
      - research/external-ofc-solver-audit-20260827
    paths:
      - 'tools/openofc_solver/external_hidden_discard_reach_completion.py'
      - 'tools/openofc_solver/test_external_hidden_discard_reach_completion.py'
      - 'tools/openofc_solver/EXTERNAL_05F_Q3_REACH_WEIGHTED_COMPLETION_CONTRACT.md'
      - '.github/workflows/openofc-external-05f-q3-smoke.yml'
  workflow_dispatch:

jobs:
  reach-weighted-completion-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Q3 counterfactual priors and completion
        run: |
          PYTHONPATH=.:tools/openofc_solver \
            python -m pytest -q tools/openofc_solver/test_external_hidden_discard_reach_completion.py
