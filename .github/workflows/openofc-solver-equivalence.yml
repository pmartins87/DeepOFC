name: OpenOFC solver old-vs-new equivalence

on:
  push:
    branches:
      - migration/openofc-solver-code-c21c3c4
    paths:
      - tools/migration/run_openofc_solver_equivalence.py
      - .github/workflows/openofc-solver-equivalence.yml
      - tools/openofc_solver/**
      - docs/migration/openofc_solver_provenance_c21c3c4.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout DeepOFC migration branch
        uses: actions/checkout@v4
        with:
          path: deepofc
          fetch-depth: 0

      - name: Checkout exact frozen OpenOFC strategic source
        uses: actions/checkout@v4
        with:
          repository: pmartins87/myoh_private
          ref: c21c3c4f1017c83df07eb22230318a8131bf40d1
          path: myoh
          fetch-depth: 1
          persist-credentials: false

      - name: Use frozen strategic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen strategic dependency
        run: python -m pip install numpy

      - name: Assert pure migrated tree before behavioral gate
        working-directory: deepofc
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/migration/openofc_solver_provenance_c21c3c4.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['source_commit'] == 'c21c3c4f1017c83df07eb22230318a8131bf40d1'
          assert data['migration_count'] == 123
          assert data['all_byte_identical'] is True
          print('OPENOFC_SOLVER_EQUIVALENCE_PRECONDITION=PASS')
          PY
          if git ls-files 'tools/openofc_solver/**' | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo 'tracked generated Python bytecode found in solver migration tree' >&2
            exit 1
          fi

      - name: Run deterministic old-vs-new equivalence
        run: |
          python deepofc/tools/migration/run_openofc_solver_equivalence.py \
            --source-root myoh \
            --target-root deepofc \
            --target-commit "${GITHUB_SHA}" \
            --report-json deepofc/docs/migration/openofc_solver_equivalence_c21c3c4.json \
            --summary-md deepofc/docs/migration/OPENOFC_SOLVER_EQUIVALENCE_C21C3C4.md \
            --temp-root "${RUNNER_TEMP}/openofc-equivalence" \
            --timeout-per-test 120

      - name: Validate equivalence report contract
        working-directory: deepofc
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/migration/openofc_solver_equivalence_c21c3c4.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema'] == 'deepofc-openofc-solver-equivalence-v1'
          assert data['source_commit'] == 'c21c3c4f1017c83df07eb22230318a8131bf40d1'
          assert data['test_count'] == 20
          assert data['matched_count'] == 20
          assert data['all_source_pass'] is True
          assert data['all_target_pass'] is True
          assert data['all_normalized_transcripts_equal'] is True
          assert data['equivalence_pass'] is True
          print('OPENOFC_SOLVER_EQUIVALENCE_REPORT_CONTRACT=PASS')
          PY

      - name: Persist equivalence evidence on migration branch
        working-directory: deepofc
        run: |
          git config user.name "DeepOFC migration automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/migration/openofc_solver_equivalence_c21c3c4.json docs/migration/OPENOFC_SOLVER_EQUIVALENCE_C21C3C4.md
          if git diff --cached --quiet; then
            echo 'Equivalence evidence already current'
            exit 0
          fi
          git commit -m "DeepOFC: record old-vs-new solver equivalence [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
